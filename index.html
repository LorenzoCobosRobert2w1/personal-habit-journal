<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#2C3E50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Organizador">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232C3E50'/%3E%3Cpath d='M52 128 L82 96 L104 114 L136 74' stroke='%23D4EFDF' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='136' cy='74' r='7' fill='%23D4EFDF'/%3E%3C/svg%3E">
<title>Organizador</title>
<style>
:root{
  --ink:#2C3E50; --ink-soft:#34495E; --paper:#FBFCFD; --card:#FFFFFF;
  --grid:#E4E8EB; --line:#D5D8DC; --muted:#8A97A0;
  --green-bg:#D4EFDF; --green-tx:#196F3D;
  --blue-bg:#D6EAF8; --blue-tx:#1B4F72;
  --amber:#B9770E; --red:#A93226;
  --nav-h:64px;

  /* Libro / Cuaderno variables (hojas crema por defecto) */
  --book-leather:#5D3A1A;
  --book-leather-dark:#3E240E;
  --book-stitch:rgba(215,175,115,.48);
  --book-page:#FDF8EC;
  --book-page-edge:#EAE0C8;
  --book-ink:#2B2118;
  --book-ink-soft:#5C4938;
  --book-ink-muted:#8C7762;
  --book-rule:rgba(139,109,76,.17);
  --book-margin:rgba(192,86,75,.28);
  --book-box-bg:rgba(93,58,26,.04);
  --book-box-border:rgba(139,109,76,.26);
  --book-chip-bg:#F6EFE0;
}

body.is-dark{
  --ink:#ECF0F1; --ink-soft:#BDC3C7; --paper:#12171D; --card:#1B232C;
  --grid:#1E2732; --line:#2C3947; --muted:#7F8C8D;
  --green-bg:rgba(25,111,61,.28); --green-tx:#58D68D;
  --blue-bg:rgba(27,79,114,.32); --blue-tx:#5DADE2;

  /* Tapa marrón en ambiente oscuro */
  --book-leather:#4A2C12;
  --book-leather-dark:#2A1808;
  --book-stitch:rgba(195,155,95,.38);
}

/* Modo oscuro con hojas oscuras y letras blancas */
body.is-dark:not(.is-cream-in-dark){
  --book-page:#1C1B1A;
  --book-page-edge:#2C2A28;
  --book-ink:#FFFFFF;
  --book-ink-soft:#E5E0D8;
  --book-ink-muted:#A69F94;
  --book-rule:rgba(255,255,255,.11);
  --book-margin:rgba(231,111,81,.32);
  --book-box-bg:rgba(255,255,255,.04);
  --book-box-border:rgba(255,255,255,.18);
  --book-chip-bg:#282624;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;
  color:var(--ink); background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  transition:background-color .2s,color .2s;
}

.top{position:sticky;top:0;z-index:5;background:#2C3E50;color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
body.is-dark .top{background:#161E27;border-bottom:1px solid var(--line)}
.top__title{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.top__sub{font-size:11px;letter-spacing:.05em;opacity:.72;margin-top:2px}
.top__actions{display:flex;align-items:center;gap:8px}

/* Botón con logo de luna en el banner */
.theme-btn{
  border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.1);color:#fff;
  border-radius:999px;padding:6px 11px;font-family:inherit;font-size:12px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,border-color .15s
}
.theme-btn:active{background:rgba(255,255,255,.22)}
.moon-logo{
  width:16px;height:16px;display:block;flex:0 0 16px;
  transition:transform .25s ease, color .2s ease;
}
body.is-dark .moon-logo{color:#F6D365;transform:rotate(-12deg)}

/* Selector rápido de hoja crema/oscura cuando el modo oscuro está activo */
.sheet-mode-btn{
  display:none;
  align-items:center;
  gap:6px;
  border:1px solid rgba(253,248,236,.35);
  background:rgba(253,248,236,.12);
  color:#FDF8EC;
  border-radius:999px;
  padding:6px 11px;
  font-family:inherit;
  font-size:11.5px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s, border-color .15s, color .15s;
}
body.is-dark .sheet-mode-btn{display:flex}
body.is-dark.is-cream-in-dark .sheet-mode-btn{
  background:#FDF8EC;
  color:#3E240E;
  border-color:#EAE0C8;
}
.sheet-dot{
  width:11px;height:11px;border-radius:50%;
  background:#FDF8EC;border:1.5px solid rgba(0,0,0,.3);
  display:inline-block;flex:0 0 11px;
}
body.is-dark:not(.is-cream-in-dark) .sheet-dot{
  background:#1C1B1A;border-color:rgba(255,255,255,.65);
}

main{max-width:520px;margin:0 auto;padding:14px 14px 24px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:14px;box-shadow:0 1px 0 rgba(44,62,80,.04)}
.card__head{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:12px}
.card__head--slate{background:#2C3E50;color:#fff;margin:-14px -14px 14px;
  padding:11px 14px;border-radius:12px 12px 0 0;letter-spacing:.1em}
.pill{background:var(--paper);border:1px solid var(--line);border-radius:999px;
  padding:2px 10px;font-size:12px;font-weight:700;color:var(--ink-soft)}

.daynav{display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:14px}
.daynav__arrow{width:44px;height:44px;border:none;background:transparent;font-size:26px;color:var(--ink);border-radius:10px;cursor:pointer}
.daynav__arrow:active{background:var(--paper)}
.daynav__center{text-align:center}
.daynav__date{font-size:19px;font-weight:700}
.daynav__wd{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

.today-btn{display:block;width:100%;margin:-6px 0 14px;padding:9px;background:transparent;
  border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.today-btn:active{background:var(--paper)}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);
  border-radius:10px;padding:12px;min-height:48px;cursor:pointer;transition:background .12s,border-color .12s;font-family:inherit}
.chip__mark{width:20px;height:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line);border-radius:6px;font-size:13px;font-weight:800;color:transparent}
.chip__label{font-size:14px;font-weight:600;color:var(--ink-soft);text-align:left;line-height:1.15}
.chip--habit.is-on{background:var(--green-bg);border-color:#9dd9b4}
.chip--habit.is-on .chip__mark{border-color:var(--green-tx);color:var(--green-tx)}
.chip--habit.is-on .chip__label{color:var(--green-tx)}
.chip--mood.is-on{background:var(--blue-bg);border-color:#a6cdec}
.chip--mood.is-on .chip__mark{border-color:var(--blue-tx);color:var(--blue-tx)}
.chip--mood.is-on .chip__label{color:var(--blue-tx)}

.hecho{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-family:inherit;font-size:15px;color:var(--ink);resize:vertical;background:var(--paper)}
.hecho:focus{outline:2px solid var(--ink);outline-offset:1px}

/* ================================================== CUADERNO / LIBRO ESTILO */
.notebook-cover{
  position:relative;
  background:linear-gradient(145deg, var(--book-leather) 0%, var(--book-leather-dark) 100%);
  padding:13px 13px 16px 20px;
  border-radius:10px 18px 18px 10px;
  box-shadow:
    0 12px 28px rgba(0,0,0,.28),
    inset 0 1px 1px rgba(255,255,255,.15),
    inset 6px 0 12px rgba(0,0,0,.45);
  border:1px solid #2A1607;
  margin-bottom:14px;
  perspective:1400px;
  overflow:hidden;
}
/* Costura del cuero */
.notebook-cover::before{
  content:"";
  position:absolute;
  top:7px; right:7px; bottom:7px; left:11px;
  border:1.5px dashed var(--book-stitch);
  border-radius:6px 13px 13px 6px;
  pointer-events:none;
}
/* Cinta marcapáginas */
.notebook-ribbon{
  position:absolute;
  top:-2px; right:28px;
  width:16px; height:32px;
  background:linear-gradient(180deg,#8E2424 0%,#B03030 100%);
  box-shadow:0 3px 6px rgba(0,0,0,.35);
  z-index:3;
  clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
}
/* Anillos / lomo izquierdo */
.notebook-spine{
  position:absolute;
  left:4px; top:22px; bottom:22px; width:10px;
  display:flex; flex-direction:column; justify-content:space-between;
  z-index:3; pointer-events:none;
}
.notebook-ring{
  width:13px; height:6px;
  background:linear-gradient(90deg,#3A2A1D,#B39874 50%,#4A3525);
  border-radius:4px;
  box-shadow:0 1px 2px rgba(0,0,0,.6);
}

/* Hoja del libro */
.notebook-page{
  position:relative;
  background-color:var(--book-page);
  color:var(--book-ink);
  border-radius:3px 11px 11px 3px;
  padding:20px 16px 22px 26px;
  transform-origin:left center;
  backface-visibility:hidden;
  box-shadow:
    inset 14px 0 20px -12px rgba(0,0,0,.22),
    3px 3px 0 var(--book-page-edge),
    6px 6px 0 rgba(0,0,0,.18);
  transition:background-color .25s, color .25s, box-shadow .25s;
}
/* Animación suave y fina al pasar la hoja */
@keyframes pageTurnNext{
  0%{
    opacity:1;
    transform:perspective(1400px) rotateY(0deg) translateX(0) scale(1);
    box-shadow:inset 14px 0 20px -12px rgba(0,0,0,.22), -8px 0 18px rgba(0,0,0,.15);
  }
  45%{
    opacity:.68;
    transform:perspective(1400px) rotateY(-24deg) translateX(-6px) scale(.992);
    box-shadow:inset 32px 0 36px -12px rgba(0,0,0,.35), 14px 4px 24px rgba(0,0,0,.28);
  }
  55%{
    opacity:.68;
    transform:perspective(1400px) rotateY(18deg) translateX(4px) scale(.995);
  }
  100%{
    opacity:1;
    transform:perspective(1400px) rotateY(0deg) translateX(0) scale(1);
  }
}
@keyframes pageTurnPrev{
  0%{
    opacity:1;
    transform:perspective(1400px) rotateY(0deg) translateX(0) scale(1);
  }
  45%{
    opacity:.68;
    transform:perspective(1400px) rotateY(22deg) translateX(6px) scale(.992);
    box-shadow:inset 26px 0 32px -10px rgba(0,0,0,.32), -10px 4px 22px rgba(0,0,0,.24);
  }
  55%{
    opacity:.68;
    transform:perspective(1400px) rotateY(-16deg) translateX(-4px) scale(.995);
  }
  100%{
    opacity:1;
    transform:perspective(1400px) rotateY(0deg) translateX(0) scale(1);
  }
}
.notebook-page.is-turning-next{
  animation:pageTurnNext .46s cubic-bezier(.22,.61,.36,1);
}
.notebook-page.is-turning-prev{
  animation:pageTurnPrev .46s cubic-bezier(.22,.61,.36,1);
}

/* Margen rojo vertical clásico de cuaderno */
.notebook-page::before{
  content:"";
  position:absolute;
  top:0; bottom:0; left:18px;
  width:1.5px;
  background:var(--book-margin);
  pointer-events:none;
}

.book-header{
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:2px double var(--book-box-border);
  padding-bottom:10px; margin-bottom:14px;
}
.book-header__nav{
  display:flex; align-items:center; gap:6px;
}
.book-pg-btn{
  width:36px; height:36px; border:1px solid var(--book-box-border);
  background:var(--book-box-bg); color:var(--book-ink);
  border-radius:8px; font-size:21px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s, transform .12s;
}
.book-pg-btn:active{transform:scale(.94);opacity:.75}
.book-date-wrap{text-align:left}
.book-date-main{
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px; font-weight:700; color:var(--book-ink);
}
.book-date-sub{
  font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--book-ink-muted); margin-top:2px;
}

.book-section-label{
  font-family:Georgia,"Times New Roman",serif;
  font-size:12px; font-style:italic;
  color:var(--book-ink-muted);
  margin-bottom:6px;
  display:flex; justify-content:space-between; align-items:center;
}

/* Área de escritura libre con renglones */
.book-writing{
  width:100%;
  min-height:224px;
  border:none;
  background-color:transparent;
  background-image:repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 31px,
    var(--book-rule) 31px,
    var(--book-rule) 32px
  );
  background-attachment:local;
  color:var(--book-ink);
  font-family:Georgia,"Times New Roman",serif;
  font-size:16px;
  line-height:32px;
  padding:0 4px;
  resize:vertical;
  display:block;
}
.book-writing::placeholder{color:var(--book-ink-muted);font-style:italic}
.book-writing:focus{outline:none}

/* Sección opcional de las preguntas diarias y nocturnas en el libro */
.book-questions-toggle{
  width:100%;
  margin-top:14px;
  padding:10px 12px;
  border:1px dashed var(--book-box-border);
  background:var(--book-box-bg);
  color:var(--book-ink);
  border-radius:8px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:13.5px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:left;
}
.book-questions-toggle:active{opacity:.8}

.book-questions-box{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--book-box-border);
  display:flex;
  flex-direction:column;
  gap:16px;
}
.book-q-group{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.book-q-group-head{
  font-family:Georgia,"Times New Roman",serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--book-ink-soft);
  border-bottom:1px solid var(--book-rule);
  padding-bottom:4px;
  display:flex;
  align-items:center;
  gap:6px;
}
.book-q-item{
  background:var(--book-box-bg);
  border:1px solid var(--book-box-border);
  border-radius:8px;
  padding:10px 11px;
}
.book-q-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:13.5px;
  font-weight:700;
  color:var(--book-ink);
  margin-bottom:6px;
}
.book-input{
  width:100%;
  border:none;
  border-bottom:1px dashed var(--book-box-border);
  background:transparent;
  color:var(--book-ink);
  padding:5px 2px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:14.5px;
  line-height:1.45;
  resize:vertical;
}
.book-input::placeholder{color:var(--book-ink-muted);font-style:italic}
.book-input:focus{outline:none;border-bottom-color:var(--book-ink)}

.book-footer{
  margin-top:14px;
  padding-top:8px;
  border-top:1px solid var(--book-rule);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:Georgia,"Times New Roman",serif;
  font-size:11.5px;
  color:var(--book-ink-muted);
}

/* semana */
.wk-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.stat__num{font-size:22px;font-weight:800;line-height:1;color:var(--ink)}
.stat__lbl{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.stat--up .stat__num{color:var(--green-tx)}
.stat--down .stat__num{color:var(--red)}
.stat--flat .stat__num{color:var(--amber)}

.wk-chart{width:100%}
.chart{width:100%;height:auto;display:block}
.b-bar{fill:var(--ink);opacity:.85}
.b-bar--today{fill:var(--green-tx);opacity:1}
.b-val{fill:var(--ink-soft);font-size:10px;font-weight:700;text-anchor:middle;font-family:inherit}
.b-lbl{fill:var(--muted);font-size:11px;text-anchor:middle;font-family:inherit}
.b-lbl--today{fill:var(--green-tx);font-weight:800}

.trend__txt{font-size:13px;color:var(--muted)}
.trend__txt--center{text-align:center;margin-top:8px}

.facts{display:flex;flex-direction:column;gap:8px}
.fact{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;
  border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;cursor:pointer;font-family:inherit}
.fact:active{background:var(--card)}
.fact__when{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fact__txt{font-size:14px;color:var(--ink);line-height:1.4;white-space:pre-wrap;word-break:break-word}

.metric{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.metric:last-child{margin-bottom:0}
.metric__name{flex:0 0 96px;font-size:13px;font-weight:600;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metric__bar{flex:1;height:10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.metric__fill{display:block;height:100%;border-radius:999px;opacity:.9}
.metric__fill--g{background:var(--green-tx)}
.metric__fill--b{background:var(--blue-tx)}
.metric__val{flex:0 0 34px;text-align:right;font-size:13px;font-weight:700;color:var(--ink-soft)}

/* editor de listas */
.edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.edit-row .line{flex:1}
.edit-del{flex:0 0 40px;height:40px;border:1px solid var(--line);background:var(--paper);border-radius:8px;
  font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
.edit-del:active{background:#f6ddd8;border-color:#e6b0aa;color:var(--red)}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row .line{flex:1}
.line{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px;font-family:inherit;font-size:15px;color:var(--ink)}
.line::placeholder{color:#B7C0C7}
.line:focus{outline:2px solid var(--ink);outline-offset:1px}

.hint{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:12px;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.btn:active{background:var(--paper)}
.btn--add{flex:0 0 auto;padding:11px 16px}
.btn--danger{grid-column:1 / -1;border-color:#e6b0aa;color:var(--red)}

/* Modal de confirmación in-page */
.confirm-box{margin-top:10px;padding:12px;border:1px solid #e6b0aa;background:rgba(169,50,38,.08);border-radius:10px;display:none}
.confirm-box.is-open{display:block}
.confirm-box__txt{font-size:13px;color:var(--ink);margin:0 0 10px;font-weight:600}
.confirm-box__actions{display:flex;gap:8px}
.confirm-box__actions .btn{flex:1;padding:9px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--card);border-top:1px solid var(--line)}
.nav__btn{flex:1;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--muted)}
.nav__ico{font-size:19px;line-height:1}
.nav__btn.is-active{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px);transform:translateX(-50%) translateY(12px);
  background:#2C3E50;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:10;max-width:90%;text-align:center}
.toast.is-show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

</style>
</head>
<body>
<header class="top">
  <div>
    <div class="top__title">Organizador</div>
    <div class="top__sub">Tus objetivos, día a día</div>
  </div>
  <div class="top__actions">
    <button class="sheet-mode-btn" id="creamSheetToggle" title="Alternar hojas color crema u oscuras en modo oscuro">
      <span class="sheet-dot" aria-hidden="true"></span>
      <span id="creamSheetLabel">Hoja crema</span>
    </button>
    <button class="theme-btn" id="themeToggle" aria-label="Cambiar modo oscuro">
      <svg class="moon-logo" id="themeIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <span id="themeLabel">Modo oscuro</span>
    </button>
  </div>
</header>

<main id="view"></main>

<nav class="nav">
  <button class="nav__btn is-active" data-tab="dia"><span class="nav__ico">✓</span>Día</button>
  <button class="nav__btn" data-tab="libro"><span class="nav__ico">📖</span>Libro</button>
  <button class="nav__btn" data-tab="semana"><span class="nav__ico">📊</span>Semana</button>
  <button class="nav__btn" data-tab="ajustes"><span class="nav__ico">⚙</span>Ajustes</button>
</nav>

<script>
(function () {
  "use strict";

  /* -------------------------------------------------------------- defaults */
  var DEFAULT_OBJ = ["Gimnasio", "Nutrición", "Pantallas", "Noche",
                     "Dormir", "Leer", "Estudiar", "Meditar"];
  var DEFAULT_MET = ["Felicidad", "Paz", "Productividad", "Energía"];
  var KEY = "organizador_v2";
  var WEEKDAYS = ["Domingo", "Lunes", "Martes", "Miércoles",
                  "Jueves", "Viernes", "Sábado"];
  var WD_SHORT = ["D", "L", "M", "M", "J", "V", "S"];
  var MONTHS = ["ene", "feb", "mar", "abr", "may", "jun",
                "jul", "ago", "sep", "oct", "nov", "dic"];

  /* Preguntas del Libro: 3 de la mañana (del día) y 3 de la noche (nocturnas) */
  var MORNING_QUESTIONS = [
    { key: "q_imp", label: "¿Qué es lo más importante para mí hoy?", ph: "Mi prioridad o enfoque principal de hoy…" },
    { key: "q_ser", label: "¿Quién elijo ser hoy?", ph: "La actitud, presencia y valores que elijo…" },
    { key: "q_dar", label: "¿Qué le puedo dar al mundo hoy?", ph: "Mi aporte o gesto hacia los demás hoy…" }
  ];
  var NIGHT_QUESTIONS = [
    { key: "q_mejor", label: "¿Hiciste lo mejor que pudiste?", ph: "Reflexión sincera sobre mi entrega de hoy…" },
    { key: "q_mejorar", label: "¿Pude haberlo hecho mejor?", ph: "Qué aprendí o qué puedo ajustar mañana…" },
    { key: "q_agradecer", label: "¿Qué puedo agradecer que viví hoy?", ph: "Momentos, personas o detalles que agradezco…" }
  ];

  /* ----------------------------------------------------------- date helpers */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(dt) { return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate()); }
  function addDays(s, n) { var dt = parse(s); dt.setDate(dt.getDate() + n); return iso(dt); }
  function label(s) { var dt = parse(s); return dt.getDate() + " " + MONTHS[dt.getMonth()]; }
  function weekday(s) { return WEEKDAYS[parse(s).getDay()]; }
  function wd3(s) { return WEEKDAYS[parse(s).getDay()].slice(0, 3); }
  function mondayOf(s) { var dt = parse(s); var g = dt.getDay(); dt.setDate(dt.getDate() + (g === 0 ? -6 : 1 - g)); return iso(dt); }
  function weekDates(mon) { var a = []; for (var i = 0; i < 7; i++) a.push(addDays(mon, i)); return a; }
  var TODAY = iso(new Date());

  /* --------------------------------------------------------------- id maker */
  var seq = 0;
  function uid(p) { seq++; return (p || "x") + Date.now().toString(36) + seq.toString(36); }

  /* ------------------------------------------------------------------ state */
  var state = {
    version: 2,
    darkMode: false,
    creamInDark: false,
    showBookQuestions: true,
    objetivos: [],
    metricas: [],
    days: {}
  };

  function seedDefaults() {
    state.objetivos = DEFAULT_OBJ.map(function (n, i) { return { id: "o" + i, name: n }; });
    state.metricas  = DEFAULT_MET.map(function (n, i) { return { id: "m" + i, name: n }; });
  }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) {}
    if (!raw) { migrateV1OrSeed(); return; }
    try {
      var p = JSON.parse(raw);
      state.objetivos = (p.objetivos && p.objetivos.length) ? p.objetivos : null;
      state.metricas  = (p.metricas && p.metricas.length) ? p.metricas : null;
      state.days = p.days || {};
      state.darkMode = !!p.darkMode;
      state.creamInDark = !!p.creamInDark;
      state.showBookQuestions = p.showBookQuestions !== undefined ? !!p.showBookQuestions : true;
      if (!state.objetivos || !state.metricas) seedDefaults();
    } catch (e) { seedDefaults(); }
  }

  function migrateV1OrSeed() {
    var old = null;
    try { old = localStorage.getItem("organizador_v1"); } catch (e) {}
    seedDefaults();
    if (!old) return;
    try {
      var p = JSON.parse(old);
      var days = p.days || {};
      Object.keys(days).forEach(function (d) {
        var r = days[d], done = {}, mood = {};
        (r.habits || []).forEach(function (v, i) { if (v && i < 8) done["o" + i] = true; });
        (r.scores || []).forEach(function (v, i) { if (v && i < 4) mood["m" + i] = true; });
        state.days[d] = { hecho: r.hecho || "", pagina: r.pagina || "", done: done, mood: mood, qs: {} };
      });
      save();
    } catch (e) {}
  }

  var persists = true;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { if (persists) { persists = false; toast("Vista previa: el guardado funciona al abrirlo en tu navegador."); } }
  }

  function day(d) {
    if (!state.days[d]) state.days[d] = { hecho: "", pagina: "", done: {}, mood: {}, qs: {} };
    var r = state.days[d];
    if (!r.done) r.done = {};
    if (!r.mood) r.mood = {};
    if (!r.qs) r.qs = {};
    if (r.hecho == null) r.hecho = "";
    if (r.pagina == null) r.pagina = "";
    return r;
  }
  function objDone(d, id) { var r = state.days[d]; return !!(r && r.done && r.done[id]); }
  function moodDone(d, id) { var r = state.days[d]; return !!(r && r.mood && r.mood[id]); }
  function dayTotal(d) {
    var r = state.days[d]; if (!r || !r.done) return 0; var c = 0;
    state.objetivos.forEach(function (o) { if (r.done[o.id]) c++; }); return c;
  }

  /* ------------------------------------------------------------- dark mode */
  function applyTheme() {
    document.body.classList.toggle("is-dark", !!state.darkMode);
    document.body.classList.toggle("is-cream-in-dark", !!(state.darkMode && state.creamInDark));
    var lbl = document.getElementById("themeLabel");
    if (lbl) lbl.textContent = state.darkMode ? "Modo oscuro: ON" : "Modo oscuro";
    var sheetLbl = document.getElementById("creamSheetLabel");
    if (sheetLbl) sheetLbl.textContent = state.creamInDark ? "Hoja crema" : "Hoja oscura";
  }

  function toggleTheme() {
    state.darkMode = !state.darkMode;
    save();
    applyTheme();
    if (tab === "ajustes") render();
  }

  function toggleCreamInDark() {
    state.creamInDark = !state.creamInDark;
    save();
    applyTheme();
    toast(state.creamInDark ? "Hojas del libro en color crema" : "Hojas del libro en modo oscuro");
    if (tab === "ajustes") render();
  }

  /* ------------------------------------------------------------- selection */
  var sel = TODAY;
  var weekMon = mondayOf(TODAY);
  var tab = "dia";
  var pageTurnDir = "";
  var root = document.getElementById("view");

  function render() {
    applyTheme();
    if (tab === "dia") renderDia();
    else if (tab === "libro") renderLibro();
    else if (tab === "semana") renderSemana();
    else renderAjustes();
    document.querySelectorAll(".nav__btn").forEach(function (b) {
      b.classList.toggle("is-active", b.dataset.tab === tab);
    });
    window.scrollTo(0, 0);
  }

  /* ============================================================== VISTA DÍA */
  function renderDia() {
    var d = day(sel);
    var n = state.objetivos.length;
    var html = "";

    html += '<div class="daynav">';
    html += '  <button class="daynav__arrow" id="prevDay" aria-label="Día anterior">‹</button>';
    html += '  <div class="daynav__center">';
    html += '    <div class="daynav__date">' + label(sel) + (sel === TODAY ? ' · Hoy' : '') + '</div>';
    html += '    <div class="daynav__wd">' + weekday(sel) + '</div>';
    html += '  </div>';
    html += '  <button class="daynav__arrow" id="nextDay" aria-label="Día siguiente">›</button>';
    html += '</div>';
    if (sel !== TODAY) html += '<button class="today-btn" id="goToday">Volver a hoy</button>';

    html += '<div class="card">';
    html += '  <div class="card__head"><span>Objetivos</span><span class="pill" id="dayPill">' + dayTotal(sel) + '/' + n + '</span></div>';
    if (n === 0) {
      html += '  <p class="hint">Todavía no cargaste objetivos. Andá a <b>Ajustes</b> para elegir los tuyos.</p>';
    } else {
      html += '  <div class="chips">';
      state.objetivos.forEach(function (o) {
        var on = objDone(sel, o.id);
        html += '<button class="chip chip--habit' + (on ? " is-on" : "") + '" data-obj="' + o.id + '">' +
                '<span class="chip__mark">' + (on ? "✔" : "") + '</span>' +
                '<span class="chip__label">' + esc(o.name) + '</span></button>';
      });
      html += '  </div>';
    }
    html += '</div>';

    html += '<div class="card">';
    html += '  <div class="card__head"><span>Hecho memorable</span></div>';
    html += '  <textarea id="hecho" class="hecho" rows="2" placeholder="Algo que quieras recordar de hoy…"></textarea>';
    html += '</div>';

    if (state.metricas.length) {
      html += '<div class="card">';
      html += '  <div class="card__head"><span>Puntuación del día</span></div>';
      html += '  <div class="chips">';
      state.metricas.forEach(function (m) {
        var on = moodDone(sel, m.id);
        html += '<button class="chip chip--mood' + (on ? " is-on" : "") + '" data-mood="' + m.id + '">' +
                '<span class="chip__mark">' + (on ? "✔" : "") + '</span>' +
                '<span class="chip__label">' + esc(m.name) + '</span></button>';
      });
      html += '  </div>';
      html += '</div>';
    }

    root.innerHTML = html;
    document.getElementById("hecho").value = d.hecho;

    document.getElementById("prevDay").onclick = function () { sel = addDays(sel, -1); renderDia(); };
    document.getElementById("nextDay").onclick = function () { sel = addDays(sel, 1); renderDia(); };
    var gt = document.getElementById("goToday"); if (gt) gt.onclick = function () { sel = TODAY; renderDia(); };

    root.querySelectorAll("[data-obj]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.dataset.obj; d.done[id] = !d.done[id]; if (!d.done[id]) delete d.done[id]; save();
        var on = !!d.done[id];
        btn.classList.toggle("is-on", on);
        btn.querySelector(".chip__mark").textContent = on ? "✔" : "";
        document.getElementById("dayPill").textContent = dayTotal(sel) + "/" + n;
      };
    });
    root.querySelectorAll("[data-mood]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.dataset.mood; d.mood[id] = !d.mood[id]; if (!d.mood[id]) delete d.mood[id]; save();
        var on = !!d.mood[id];
        btn.classList.toggle("is-on", on);
        btn.querySelector(".chip__mark").textContent = on ? "✔" : "";
      };
    });
    var ta = document.getElementById("hecho");
    ta.oninput = function () { d.hecho = ta.value; save(); };
  }

  /* ============================================================ VISTA LIBRO */
  function turnBookPage(delta) {
    pageTurnDir = delta > 0 ? "is-turning-next" : "is-turning-prev";
    sel = addDays(sel, delta);
    renderLibro();
  }

  function renderLibro() {
    var d = day(sel);
    var animClass = pageTurnDir ? " " + pageTurnDir : "";
    pageTurnDir = "";
    var html = "";

    if (sel !== TODAY) {
      html += '<button class="today-btn" id="bookGoToday">Volver a la página de hoy (' + label(TODAY) + ')</button>';
    }

    html += '<div class="notebook-cover">';
    html += '  <div class="notebook-ribbon" aria-hidden="true"></div>';
    html += '  <div class="notebook-spine" aria-hidden="true">';
    for (var r = 0; r < 6; r++) {
      html += '<span class="notebook-ring"></span>';
    }
    html += '  </div>';

    html += '  <div class="notebook-page' + animClass + '" id="notebookPage">';
    html += '    <div class="book-header">';
    html += '      <div class="book-date-wrap">';
    html += '        <div class="book-date-main">' + weekday(sel) + ', ' + label(sel) + (sel === TODAY ? ' · Hoy' : '') + '</div>';
    html += '        <div class="book-date-sub">Cuaderno personal · ' + sel.slice(0, 4) + '</div>';
    html += '      </div>';
    html += '      <div class="book-header__nav">';
    html += '        <button class="book-pg-btn" id="prevBookDay" aria-label="Página anterior" title="Página anterior">‹</button>';
    html += '        <button class="book-pg-btn" id="nextBookDay" aria-label="Página siguiente" title="Página siguiente">›</button>';
    html += '      </div>';
    html += '    </div>';

    html += '    <div class="book-section-label">';
    html += '      <span>Página libre del día</span>';
    html += '      <span id="wordCount">0 palabras</span>';
    html += '    </div>';
    html += '    <textarea id="bookPageText" class="book-writing" rows="8" placeholder="Querido diario… Escribí libremente todo lo que quieras sobre tu día en esta hoja."></textarea>';

    /* Botón para desplegar u ocultar las preguntas diarias y nocturnas */
    html += '    <button class="book-questions-toggle" id="toggleBookQuestions">';
    html += '      <span>✒️ Responder las preguntas diarias (opcional)</span>';
    html += '      <span id="qToggleArrow">' + (state.showBookQuestions ? '▲' : '▼') + '</span>';
    html += '    </button>';

    if (state.showBookQuestions) {
      html += '    <div class="book-questions-box" id="bookQuestionsBox">';

      /* Bloque 1: Preguntas del día (mañana) */
      html += '      <div class="book-q-group">';
      html += '        <div class="book-q-group-head"><span>☀️ Preguntas del día</span></div>';
      MORNING_QUESTIONS.forEach(function (q) {
        html += '      <div class="book-q-item">';
        html += '        <div class="book-q-title">' + esc(q.label) + '</div>';
        html += '        <textarea class="book-input" rows="2" data-qkey="' + q.key + '" placeholder="' + esc(q.ph) + '"></textarea>';
        html += '      </div>';
      });
      html += '      </div>';

      /* Bloque 2: Preguntas nocturnas */
      html += '      <div class="book-q-group">';
      html += '        <div class="book-q-group-head"><span>🌙 Preguntas nocturnas</span></div>';
      NIGHT_QUESTIONS.forEach(function (q) {
        html += '      <div class="book-q-item">';
        html += '        <div class="book-q-title">' + esc(q.label) + '</div>';
        html += '        <textarea class="book-input" rows="2" data-qkey="' + q.key + '" placeholder="' + esc(q.ph) + '"></textarea>';
        html += '      </div>';
      });
      html += '      </div>';

      html += '    </div>';
    }

    html += '    <div class="book-footer">';
    html += '      <span>Guardado automático</span>';
    html += '      <span>Fecha: ' + sel + '</span>';
    html += '    </div>';
    html += '  </div>';
    html += '</div>';

    root.innerHTML = html;

    var pageTa = document.getElementById("bookPageText");
    pageTa.value = d.pagina || "";
    function updateWords() {
      var trimmed = pageTa.value.trim();
      var count = trimmed ? trimmed.split(/\s+/).length : 0;
      var wc = document.getElementById("wordCount");
      if (wc) wc.textContent = count + (count === 1 ? " palabra" : " palabras");
    }
    updateWords();

    pageTa.oninput = function () {
      d.pagina = pageTa.value;
      save();
      updateWords();
    };

    root.querySelectorAll("[data-qkey]").forEach(function (ta) {
      var k = ta.dataset.qkey;
      ta.value = (d.qs && d.qs[k]) ? d.qs[k] : "";
      ta.oninput = function () {
        if (!d.qs) d.qs = {};
        d.qs[k] = ta.value;
        save();
      };
    });

    document.getElementById("prevBookDay").onclick = function () { turnBookPage(-1); };
    document.getElementById("nextBookDay").onclick = function () { turnBookPage(1); };
    var bgt = document.getElementById("bookGoToday");
    if (bgt) bgt.onclick = function () {
      var diff = parse(TODAY) > parse(sel) ? 1 : -1;
      pageTurnDir = diff > 0 ? "is-turning-next" : "is-turning-prev";
      sel = TODAY;
      renderLibro();
    };

    document.getElementById("toggleBookQuestions").onclick = function () {
      state.showBookQuestions = !state.showBookQuestions;
      save();
      renderLibro();
    };
  }

  /* =========================================================== VISTA SEMANA */
  function weekSum(mon) { var s = 0; weekDates(mon).forEach(function (d) { s += dayTotal(d); }); return s; }

  function renderSemana() {
    var dates = weekDates(weekMon);
    var sun = dates[6];
    var totals = dates.map(dayTotal);
    var done = totals.reduce(function (a, b) { return a + b; }, 0);
    var n = state.objetivos.length;
    var possible = n * 7;
    var pct = possible ? Math.round(done / possible * 100) : 0;

    var prevDone = weekSum(addDays(weekMon, -7));
    var delta = done - prevDone;
    var dir = delta > 0 ? "up" : (delta < 0 ? "down" : "flat");
    var arrow = delta > 0 ? "↑" : (delta < 0 ? "↓" : "→");
    var trendTxt = delta > 0 ? "+" + delta + " vs. semana anterior"
                 : delta < 0 ? delta + " vs. semana anterior"
                 : "igual que la semana anterior";

    var best = 0, bestDay = -1;
    totals.forEach(function (t, i) { if (t > best) { best = t; bestDay = i; } });

    var html = "";
    html += '<div class="daynav">';
    html += '  <button class="daynav__arrow" id="prevWk" aria-label="Semana anterior">‹</button>';
    html += '  <div class="daynav__center">';
    html += '    <div class="daynav__date">' + label(weekMon) + ' – ' + label(sun) + '</div>';
    html += '    <div class="daynav__wd">' + (weekMon === mondayOf(TODAY) ? 'Esta semana' : 'Lunes a domingo') + '</div>';
    html += '  </div>';
    html += '  <button class="daynav__arrow" id="nextWk" aria-label="Semana siguiente">›</button>';
    html += '</div>';
    if (weekMon !== mondayOf(TODAY)) html += '<button class="today-btn" id="goThisWk">Volver a esta semana</button>';

    /* resumen */
    html += '<div class="card">';
    html += '  <div class="card__head"><span>Resumen de la semana</span><span class="pill">' + pct + '%</span></div>';
    html += '  <div class="wk-stats">';
    html += '    <div class="stat"><div class="stat__num">' + done + '</div><div class="stat__lbl">marcados</div></div>';
    html += '    <div class="stat"><div class="stat__num">' + (bestDay >= 0 ? WD_SHORT[parse(dates[bestDay]).getDay()] : '–') + '</div><div class="stat__lbl">mejor día</div></div>';
    html += '    <div class="stat stat--' + dir + '"><div class="stat__num">' + arrow + '</div><div class="stat__lbl">' + (delta > 0 ? '+' + delta : (delta < 0 ? delta : '=')) + '</div></div>';
    html += '  </div>';
    html += '  <div class="wk-chart">' + weekChart(dates, totals, n) + '</div>';
    html += '  <div class="trend__txt trend__txt--center">' + trendTxt + '</div>';
    html += '</div>';

    /* por objetivo */
    if (n) {
      html += '<div class="card">';
      html += '  <div class="card__head"><span>Objetivos (días cumplidos)</span></div>';
      state.objetivos.forEach(function (o) {
        var c = 0; dates.forEach(function (d) { if (objDone(d, o.id)) c++; });
        var w = Math.round(c / 7 * 100);
        html += '<div class="metric"><span class="metric__name">' + esc(o.name) + '</span>' +
                '<span class="metric__bar"><span class="metric__fill metric__fill--g" style="width:' + w + '%"></span></span>' +
                '<span class="metric__val">' + c + '/7</span></div>';
      });
      html += '</div>';
    }

    /* por métrica */
    if (state.metricas.length) {
      html += '<div class="card">';
      html += '  <div class="card__head"><span>Puntuación (días marcados)</span></div>';
      state.metricas.forEach(function (m) {
        var c = 0; dates.forEach(function (d) { if (moodDone(d, m.id)) c++; });
        var w = Math.round(c / 7 * 100);
        html += '<div class="metric"><span class="metric__name">' + esc(m.name) + '</span>' +
                '<span class="metric__bar"><span class="metric__fill metric__fill--b" style="width:' + w + '%"></span></span>' +
                '<span class="metric__val">' + c + '/7</span></div>';
      });
      html += '</div>';
    }

    /* hechos memorables de la semana */
    var facts = [];
    dates.forEach(function (d) {
      var r = state.days[d];
      var h = r && r.hecho ? r.hecho.trim() : "";
      if (h) facts.push({ d: d, h: h });
    });
    html += '<div class="card">';
    html += '  <div class="card__head"><span>Hechos memorables</span><span class="pill">' + facts.length + '</span></div>';
    if (!facts.length) {
      html += '  <p class="hint">Todavía no anotaste hechos esta semana. Escribilos en la pestaña Día.</p>';
    } else {
      html += '  <div class="facts">';
      facts.forEach(function (f) {
        html += '<button class="fact" data-date="' + f.d + '">' +
                '<span class="fact__when">' + wd3(f.d) + ' ' + label(f.d) + '</span>' +
                '<span class="fact__txt">' + esc(f.h) + '</span></button>';
      });
      html += '  </div>';
    }
    html += '</div>';

    root.innerHTML = html;
    root.querySelectorAll(".fact").forEach(function (btn) {
      btn.onclick = function () { sel = btn.dataset.date; tab = "dia"; render(); };
    });
    document.getElementById("prevWk").onclick = function () { weekMon = addDays(weekMon, -7); renderSemana(); };
    document.getElementById("nextWk").onclick = function () { weekMon = addDays(weekMon, 7); renderSemana(); };
    var gw = document.getElementById("goThisWk"); if (gw) gw.onclick = function () { weekMon = mondayOf(TODAY); renderSemana(); };
  }

  function weekChart(dates, totals, n) {
    var W = 320, H = 128, PB = 22, PT = 10, PL = 6, PR = 6;
    var maxY = Math.max(1, n);
    var innerW = W - PL - PR, innerH = H - PT - PB;
    var slot = innerW / 7, bw = slot * 0.56;
    var bars = "";
    for (var i = 0; i < 7; i++) {
      var t = totals[i];
      var bh = (t / maxY) * innerH;
      var x = PL + i * slot + (slot - bw) / 2;
      var y = PT + innerH - bh;
      var isToday = dates[i] === TODAY;
      bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) +
              '" height="' + Math.max(0, bh).toFixed(1) + '" rx="3" class="b-bar' + (isToday ? ' b-bar--today' : '') + '"/>';
      if (t > 0) bars += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 3).toFixed(1) + '" class="b-val">' + t + '</text>';
      bars += '<text x="' + (PL + i * slot + slot / 2).toFixed(1) + '" y="' + (H - 6) + '" class="b-lbl' + (isToday ? ' b-lbl--today' : '') + '">' + WD_SHORT[parse(dates[i]).getDay()] + '</text>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" preserveAspectRatio="xMidYMid meet">' + bars + '</svg>';
  }

  /* ========================================================= VISTA AJUSTES */
  function renderAjustes() {
    var html = "";
    html += '<div class="card">';
    html += '  <div class="card__head card__head--slate">Apariencia y cuaderno</div>';
    html += '  <p class="hint">Podés usar el modo oscuro con hojas oscuras (letras blancas) o mantener las hojas del libro en color crema.</p>';
    html += '  <div class="btns">';
    html += '    <button class="btn" id="settingsDarkBtn">' +
                 (state.darkMode ? '🌙 Modo oscuro: Activado' : '🌙 Activar modo oscuro') + '</button>';
    html += '    <button class="btn" id="settingsCreamBtn">' +
                 (state.creamInDark ? '📜 Hojas en oscuro: Crema' : '🌑 Hojas en oscuro: Oscuras') + '</button>';
    html += '  </div>';
    html += '</div>';

    html += '<div class="card">';
    html += '  <div class="card__head card__head--slate">Mis objetivos</div>';
    html += '  <p class="hint">Estos son los hábitos que marcás cada día. Editalos, borralos o agregá los tuyos.</p>';
    html += '  <div id="objEd"></div>';
    html += '  <div class="add-row"><input type="text" id="objNew" class="line" placeholder="Nuevo objetivo…"><button class="btn btn--add" id="objAdd">Agregar</button></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '  <div class="card__head card__head--slate">Mi puntuación</div>';
    html += '  <p class="hint">Lo que evaluás al final del día (ánimo, energía, etc.).</p>';
    html += '  <div id="metEd"></div>';
    html += '  <div class="add-row"><input type="text" id="metNew" class="line" placeholder="Nueva métrica…"><button class="btn btn--add" id="metAdd">Agregar</button></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '  <div class="card__head">Copia de seguridad</div>';
    html += '  <p class="hint">Tu registro se guarda en este dispositivo. Exportá un respaldo cada tanto para no perderlo.</p>';
    html += '  <div class="btns">';
    html += '    <button class="btn" id="expJson">Exportar respaldo</button>';
    html += '    <button class="btn" id="impJson">Importar respaldo</button>';
    html += '    <button class="btn" id="expCsv">Exportar a Excel (CSV)</button>';
    html += '    <button class="btn btn--danger" id="wipe">Borrar todo</button>';
    html += '  </div>';
    html += '  <div class="confirm-box" id="wipeConfirm">';
    html += '    <p class="confirm-box__txt">¿Borrar todo el registro de este dispositivo? No se puede deshacer.</p>';
    html += '    <div class="confirm-box__actions">';
    html += '      <button class="btn" id="wipeCancel">Cancelar</button>';
    html += '      <button class="btn btn--danger" id="wipeYes">Sí, borrar todo</button>';
    html += '    </div>';
    html += '  </div>';
    html += '  <input type="file" id="file" accept="application/json,.json" hidden>';
    html += '</div>';

    root.innerHTML = html;
    buildEditor("objEd", state.objetivos);
    buildEditor("metEd", state.metricas);

    document.getElementById("settingsDarkBtn").onclick = toggleTheme;
    document.getElementById("settingsCreamBtn").onclick = toggleCreamInDark;
    document.getElementById("objAdd").onclick = function () { addItem("objNew", state.objetivos, "o"); };
    document.getElementById("metAdd").onclick = function () { addItem("metNew", state.metricas, "m"); };
    document.getElementById("objNew").onkeydown = function (e) { if (e.key === "Enter") addItem("objNew", state.objetivos, "o"); };
    document.getElementById("metNew").onkeydown = function (e) { if (e.key === "Enter") addItem("metNew", state.metricas, "m"); };

    document.getElementById("expJson").onclick = exportJson;
    document.getElementById("expCsv").onclick = exportCsv;
    document.getElementById("impJson").onclick = function () { document.getElementById("file").click(); };
    document.getElementById("file").onchange = importJson;
    document.getElementById("wipe").onclick = wipe;
    document.getElementById("wipeCancel").onclick = function () {
      document.getElementById("wipeConfirm").classList.remove("is-open");
    };
    document.getElementById("wipeYes").onclick = function () {
      state.days = {}; save(); render(); toast("Registro borrado");
    };
  }

  function buildEditor(boxId, arr) {
    var box = document.getElementById(boxId);
    box.innerHTML = "";
    arr.forEach(function (item, idx) {
      var row = document.createElement("div"); row.className = "edit-row";
      var inp = document.createElement("input"); inp.type = "text"; inp.className = "line"; inp.value = item.name;
      inp.oninput = function () { item.name = inp.value; save(); };
      var del = document.createElement("button"); del.className = "edit-del"; del.textContent = "×"; del.setAttribute("aria-label", "Borrar");
      del.onclick = function () { arr.splice(idx, 1); save(); buildEditor(boxId, arr); };
      row.appendChild(inp); row.appendChild(del); box.appendChild(row);
    });
    if (!arr.length) { var e = document.createElement("p"); e.className = "hint"; e.textContent = "Lista vacía — agregá al menos uno abajo."; box.appendChild(e); }
  }

  function addItem(inputId, arr, prefix) {
    var inp = document.getElementById(inputId);
    var v = inp.value.trim(); if (!v) return;
    arr.push({ id: uid(prefix), name: v }); inp.value = ""; save();
    buildEditor(prefix === "o" ? "objEd" : "metEd", arr); inp.focus();
  }

  /* ------------------------------------------------------------- backup i/o */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type }), url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }
  function exportJson() { download("organizador_" + TODAY + ".json", JSON.stringify(state, null, 2), "application/json"); }
  function exportCsv() {
    var qCols = MORNING_QUESTIONS.concat(NIGHT_QUESTIONS);
    var head = ["Fecha", "Hecho", "Libro"].concat(
      qCols.map(function (q) { return q.label; }),
      state.objetivos.map(function (o) { return o.name; }),
      ["Total"],
      state.metricas.map(function (m) { return m.name; })
    );
    var rows = [head.join(",")];
    var keys = Object.keys(state.days).sort();
    keys.forEach(function (d) {
      var r = state.days[d];
      var cells = [
        d,
        '"' + (r.hecho || "").replace(/"/g, '""') + '"',
        '"' + (r.pagina || "").replace(/"/g, '""') + '"'
      ];
      qCols.forEach(function (q) {
        var ans = (r.qs && r.qs[q.key]) ? r.qs[q.key] : "";
        cells.push('"' + ans.replace(/"/g, '""') + '"');
      });
      state.objetivos.forEach(function (o) { cells.push(r.done && r.done[o.id] ? "SI" : ""); });
      cells.push(dayTotal(d));
      state.metricas.forEach(function (m) { cells.push(r.mood && r.mood[m.id] ? "SI" : ""); });
      rows.push(cells.join(","));
    });
    download("organizador_" + TODAY + ".csv", "\uFEFF" + rows.join("\r\n"), "text/csv");
  }
  function importJson(ev) {
    var f = ev.target.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var p = JSON.parse(reader.result);
        if (p.objetivos && p.objetivos.length) state.objetivos = p.objetivos;
        if (p.metricas && p.metricas.length) state.metricas = p.metricas;
        if (p.darkMode !== undefined) state.darkMode = !!p.darkMode;
        if (p.creamInDark !== undefined) state.creamInDark = !!p.creamInDark;
        state.days = p.days || {};
        save(); render(); toast("Respaldo importado");
      } catch (e) { toast("No se pudo leer el archivo"); }
    };
    reader.readAsText(f); ev.target.value = "";
  }
  function wipe() {
    var box = document.getElementById("wipeConfirm");
    if (box) box.classList.toggle("is-open");
  }

  /* ------------------------------------------------------------------ utils */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var toastEl;
  function toast(msg) {
    if (!toastEl) { toastEl = document.createElement("div"); toastEl.className = "toast"; document.body.appendChild(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("is-show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { toastEl.classList.remove("is-show"); }, 1900);
  }

  /* -------------------------------------------------------------------- init */
  document.getElementById("themeToggle").onclick = toggleTheme;
  document.getElementById("creamSheetToggle").onclick = toggleCreamInDark;
  document.querySelectorAll(".nav__btn").forEach(function (b) {
    b.onclick = function () { tab = b.dataset.tab; render(); };
  });
  load();
  render();
})();

</script>

    navigator.serviceWorker.register("./service-worker.js").catch(function () {});
  });
}
